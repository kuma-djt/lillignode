# Builds Lillignode, runs its unit tests and the lint, on Windows, Linux
# and macOS on every push. The format check runs once, on Linux.
#
# On every system it also runs the end-to-end check, which drives the real
# program against the stand-in agent. On Windows that check needs
# Microsoft's two pseudo-terminal files beside the program to cover status;
# the packaging script fetches them from the pinned Windows Terminal release
# and refuses them unless both hashes match and both are signed by
# Microsoft (docs/packaging-windows.md).
#
# The macOS runner is Apple Silicon. Its release build is kept as a
# download of the run, packed as a .tar.gz so the program keeps its
# permission to run, for anyone who wants to try it: it is not a release,
# is not signed, and has not been run by a person.
#
# Nothing here starts a real agent or reads a real Claude Code setup: unit
# tests use fakes and throwaway folders, and the end-to-end check uses the
# stand-in in a throwaway folder.

name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, unit tests and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One system failing must not hide what the others do.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      # Pinned to a commit, not a tag, so the code that runs cannot change
      # under the same name. This is actions/checkout v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use the current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Build everything
        run: cargo build --all-targets --locked
      - name: Unit tests
        run: cargo test --locked
      - name: The tape player's own tests
        run: cargo test --locked --example standin
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Release build
        run: cargo build --release --all-targets --locked
      # Downloads the pinned package from Microsoft's Windows Terminal
      # release and places the two files beside the program only if both
      # match their recorded hashes and carry Microsoft's signature.
      - name: Microsoft's pseudo-terminal files, checked
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -BesideBuild
      - name: End-to-end check against the stand-in
        run: cargo run --release --locked --example e2e
      - name: The page, checked against the stand-in
        run: cargo run --release --locked --example page_check
      - name: The hand checks a script can judge, against the stand-in
        run: cargo run --release --locked --example handcheck
      # A .tar.gz keeps the program's permission to run, which the download
      # of a run does not.
      - name: Pack the macOS build
        if: runner.os == 'macOS' && !cancelled()
        run: tar -czf lillignode-macos-arm64-untested.tar.gz -C target/release lillignode -C "$GITHUB_WORKSPACE" LICENSE README.md
      # Kept whether or not the checks above passed, so a build that fails
      # a check can still be looked at. This is actions/upload-artifact v7.0.2.
      - name: Keep the macOS build
        if: runner.os == 'macOS' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lillignode-macos-arm64-untested
          path: lillignode-macos-arm64-untested.tar.gz
          if-no-files-found: error
          retention-days: 30
